# ============================================================
# GENERAL SETTINGS
# ============================================================

# Unbind all existing default keybindings
unbind -a

# Terminal & True Color support
set -a terminal-features "tmux-256color:RGB"
set -ga terminal-overrides ",xterm-256color:Tc"

# Set Prefix Key (Ctrl-t)
set -g prefix C-t
bind C-t send-prefix

# General Options
set -g base-index 1
set -g mode-keys vi
set -g mouse on
set -g renumber-windows on
set -g aggressive-resize on

# Status Line Configuration
set -g status-left "#S "
set -g status-right ""
set -g status-style "bg=default"
set -g window-status-current-style "fg=black bold, bg=blue"

# ============================================================
# KEYBINDINGS (Prefix = C-t)
# ============================================================

# Window Management
bind-key n new-window -c "#{pane_current_path}"
bind-key j previous-window
bind-key k next-window
bind-key r command-prompt -I "#W" "rename-window '%%'"

# Pane Creation (Splits)
bind-key p split-window -h -c "#{pane_current_path}"
bind-key P split-window -v -c "#{pane_current_path}"

# Pane Navigation (Vim Directional Focus)
bind-key H select-pane -L
bind-key J select-pane -D
bind-key K select-pane -U
bind-key L select-pane -R

# Search & Copy Mode
bind-key / copy-mode \; command-prompt -p "Search up:" "send -X search-backward '%%'"
bind-key ? copy-mode \; command-prompt -p "Search down:" "send -X search-forward '%%'"

# Sessions & Closing
bind-key o choose-session
bind-key x kill-pane
bind-key X kill-window

# Quick Config Reload
bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded!"
